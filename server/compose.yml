name: enso-api-local
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: enso_local
      POSTGRES_USER: enso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run init:local first}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enso -d enso_local"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  database:
